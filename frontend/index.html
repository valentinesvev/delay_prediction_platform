<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Текущее состояние автобуса</title>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #172438; font-family: system-ui, sans-serif; }
main { text-align: center; padding: 24px; max-width: 600px; }
#state { display: block; font-size: clamp(80px, 20vw, 220px); font-weight: 600; }
button { padding: 14px 20px; border: 0; border-radius: 10px; background: #245bcc; color: white; font: inherit; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
button:focus-visible { outline: 3px solid #172438; outline-offset: 4px; }
p { color: #526077; line-height: 1.5; }
#average { display: block; min-height: 3em; margin-top: 20px; font-size: 20px; }
</style>
</head>
<body>
<main>
<output id="state" aria-label="Текущее состояние автобуса" aria-live="polite">—</output>
<button id="average-button" type="button">Вывести среднее из последних 10</button>
<p>По нажатию FastAPI вычислит среднее последних 10 сохранённых чисел.</p>
<output id="average" aria-live="polite"></output>
</main>
<script>
const output = document.querySelector('#state');
const averageButton = document.querySelector('#average-button');
const averageOutput = document.querySelector('#average');
averageButton.addEventListener('click', async () => {
  averageButton.disabled = true;
  averageOutput.textContent = 'Запрос к FastAPI…';
  try {
    const response = await fetch('/predictions/average', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
    if (!response.ok) throw new Error('API недоступен');
    const result = await response.json();
    averageOutput.textContent = result.status === 'ready'
      ? `Среднее: ${new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(result.average)} · Записей: ${result.count} из 10`
      : 'Пока нет данных для расчёта';
  } catch {
    averageOutput.textContent = 'Не удалось получить среднее. Попробуйте ещё раз.';
  } finally {
    averageButton.disabled = false;
  }
});
async function refresh() {
  try {
    const response = await fetch('/predictions/latest', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
    if (!response.ok) throw new Error('API недоступен');
    const result = await response.json();
    output.textContent = result.status === 'ready' ? result.state : '—';
    output.title = result.status === 'ready' ? `Рассчитано: ${result.predicted_at}` : 'Свежих данных нет';
  } catch {
    output.textContent = '—';
    output.title = 'Нет соединения с API';
  } finally {
    setTimeout(refresh, 1000);
  }
}
refresh();
</script>
</body>
</html>
