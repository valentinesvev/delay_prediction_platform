<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прогноз движения</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 3rem auto; padding: 0 1rem; color: #243142; background: #f4f6f9; }
h1 { font-size: 1.7rem; }
.table-wrap { overflow-x: auto; background: white; border-radius: 12px; box-shadow: 0 2px 12px #24314214; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: .8rem; border-bottom: 1px solid #e3e8f0; text-align: left; white-space: nowrap; }
th { background: #e8eef7; }
.stale, .degraded, .baseline { color: #ad5d00; }
</style>
<h1>Прогноз прибытия транспорта</h1>
<p id="message" role="status" aria-live="polite">Загружаем прогнозы…</p>
<div class="table-wrap">
  <table aria-label="Последние прогнозы для автобусов">
    <thead><tr><th>ТС</th><th>Остановка</th><th>Задержка, с</th><th>Прибытие</th><th>Прогноз на</th><th>Модель</th><th>Состояние</th></tr></thead>
    <tbody id="predictions"></tbody>
  </table>
</div>
<script>
const message = document.querySelector('#message');
const body = document.querySelector('#predictions');
const formatTime = value => new Intl.DateTimeFormat('ru-RU', {dateStyle: 'short', timeStyle: 'medium', timeZone: 'Europe/Moscow'}).format(new Date(value));
async function refresh() {
  try {
    const response = await fetch('/predictions/latest', {cache: 'no-store', signal: AbortSignal.timeout(5000)});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    body.replaceChildren();
    for (const item of data.predictions) {
      const row = body.insertRow();
      const values = [
        item.tr_id, item.target_stop_id, item.predicted_delay_s,
        formatTime(item.predicted_arrival), formatTime(item.t_forecast),
        item.model_used, [item.status === 'stale' ? 'Устарел' : 'Актуален',
          item.degraded ? 'нет свежей телеметрии' : ''].filter(Boolean).join(' · ')
      ];
      values.forEach(value => { const cell = row.insertCell(); cell.textContent = value; });
      if (item.status === 'stale') row.classList.add('stale');
      if (item.degraded) row.classList.add('degraded');
      if (item.model_used === 'baseline') row.classList.add('baseline');
    }
    message.textContent = data.predictions.length
      ? 'ТС: ' + data.predictions.length + ' · Обновлено ' + new Date().toLocaleTimeString('ru-RU')
      : 'Прогнозов пока нет.';
  } catch {
    message.textContent = 'Не удалось загрузить прогнозы. Проверим подключение к базе и FastAPI.';
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</html>
